# This workflow builds, tests and cross compiles GoAccountHub with mage.
# See build.go for the build targets used here.

name: Go

on:
  push:
    branches: [ "main" ]

jobs:

  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.27'
        cache: true

    - name: Test
      run: go test -v ./...

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.27'
        cache: true

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: GAHFrontend/package-lock.json

    - name: Install mage
      run: go install github.com/magefile/mage

    - name: Add GOPATH/bin to PATH
      run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

    - name: Read version
      id: version
      run: echo "value=$(cat GAHversion)" >> "$GITHUB_OUTPUT"

    - name: Build frontend and cross compile
      run: mage allcross

    - name: Upload binaries
      uses: actions/upload-artifact@v4
      with:
        name: GoAccountHub-${{ steps.version.outputs.value }}
        path: bin/*
        if-no-files-found: error
